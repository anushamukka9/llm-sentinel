[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-sentinel"
version = "0.1.0"
description = "Deterministic guardrails for LLM apps: scan prompts and outputs for prompt injection, secrets, PII, toxicity and more. No model calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["llm", "guardrails", "prompt-injection", "pii", "secrets", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
langchain = ["langchain-core>=0.2"]
test = ["pytest>=8", "fastapi>=0.100", "starlette>=0.27", "httpx>=0.24", "langchain-core>=0.2"]
lint = ["ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/anushamukka9/llm-sentinel"
Issues = "https://github.com/anushamukka9/llm-sentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
